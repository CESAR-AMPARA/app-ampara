name: Deploy to EC2 via SSH

# Deploys only main commits whose CI run passed, and exactly the commit CI tested.
on:
  workflow_run:
    workflows: [ "Continuous Integration" ]
    types: [ completed ]
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~
            if [ ! -d "app-ampara" ]; then
              git clone https://github.com/CESAR-AMPARA/app-ampara.git
            fi
            cd app-ampara
            git fetch --all
            git reset --hard ${{ github.event.workflow_run.head_sha }}
            sudo docker compose down
            sudo docker compose up -d --build --force-recreate
